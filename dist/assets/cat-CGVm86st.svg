<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 450" width="400" height="450">
  <defs>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f4a460"/>
      <stop offset="100%" style="stop-color:#d2691e"/>
    </linearGradient>
    <linearGradient id="bellyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#fff8ee"/>
      <stop offset="100%" style="stop-color:#ffe4cc"/>
    </linearGradient>
  </defs>

  <!-- Tail -->
  <g class="tail" style="transform-origin: 320px 320px;">
    <path d="M 310 310 Q 370 280 380 220 Q 390 170 360 150"
          fill="none" stroke="url(#bodyGrad)" stroke-width="18" stroke-linecap="round"/>
    <path d="M 310 310 Q 370 280 380 220 Q 390 170 360 150"
          fill="none" stroke="#d2691e" stroke-width="10" stroke-linecap="round" opacity="0.4"/>
  </g>

  <!-- Back legs -->
  <ellipse cx="130" cy="370" rx="28" ry="40" fill="url(#bodyGrad)"/>
  <ellipse cx="270" cy="370" rx="28" ry="40" fill="url(#bodyGrad)"/>
  <!-- Paws (back) -->
  <ellipse cx="130" cy="400" rx="24" ry="12" fill="#fff8ee"/>
  <ellipse cx="270" cy="400" rx="24" ry="12" fill="#fff8ee"/>

  <!-- Body -->
  <ellipse cx="200" cy="300" rx="100" ry="80" fill="url(#bodyGrad)"/>
  <!-- Belly -->
  <ellipse cx="200" cy="320" rx="60" ry="45" fill="url(#bellyGrad)"/>

  <!-- Front legs -->
  <rect x="145" y="320" width="30" height="70" rx="15" fill="url(#bodyGrad)"/>
  <rect x="225" y="320" width="30" height="70" rx="15" fill="url(#bodyGrad)"/>
  <!-- Paws (front) -->
  <ellipse cx="160" cy="392" rx="20" ry="10" fill="#fff8ee"/>
  <ellipse cx="240" cy="392" rx="20" ry="10" fill="#fff8ee"/>

  <!-- Head -->
  <circle cx="200" cy="175" r="85" fill="url(#bodyGrad)"/>

  <!-- Left ear -->
  <polygon points="130,115 118,40 175,90" fill="url(#bodyGrad)"/>
  <polygon points="133,112 125,58 168,95" fill="#ffb6c1"/>

  <!-- Right ear -->
  <polygon points="270,115 282,40 225,90" fill="url(#bodyGrad)"/>
  <polygon points="267,112 275,58 232,95" fill="#ffb6c1"/>

  <!-- Face white patch -->
  <ellipse cx="200" cy="195" rx="42" ry="48" fill="#fff8ee"/>

  <!-- Eyes -->
  <g class="eye-left">
    <ellipse cx="165" cy="170" rx="16" ry="18" fill="#fff"/>
    <ellipse cx="165" cy="172" rx="10" ry="12" fill="#2d8a4e"/>
    <ellipse cx="165" cy="172" rx="6" ry="8" fill="#111"/>
    <ellipse cx="162" cy="168" rx="3" ry="3" fill="#fff"/>
  </g>
  <g class="eye-right">
    <ellipse cx="235" cy="170" rx="16" ry="18" fill="#fff"/>
    <ellipse cx="235" cy="172" rx="10" ry="12" fill="#2d8a4e"/>
    <ellipse cx="235" cy="172" rx="6" ry="8" fill="#111"/>
    <ellipse cx="232" cy="168" rx="3" ry="3" fill="#fff"/>
  </g>

  <!-- Eyebrows -->
  <path d="M 150 150 Q 165 143 180 150" fill="none" stroke="#8B6914" stroke-width="3" stroke-linecap="round"/>
  <path d="M 220 150 Q 235 143 250 150" fill="none" stroke="#8B6914" stroke-width="3" stroke-linecap="round"/>

  <!-- Nose -->
  <polygon points="200,192 194,200 206,200" fill="#ff9eb5"/>

  <!-- Mouth -->
  <path d="M 200 200 L 200 208" stroke="#666" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M 200 208 Q 192 215 185 210" stroke="#666" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M 200 208 Q 208 215 215 210" stroke="#666" stroke-width="2.5" fill="none" stroke-linecap="round"/>

  <!-- Whiskers left -->
  <line x1="100" y1="195" x2="160" y2="200" stroke="#8B7355" stroke-width="1.5" opacity="0.7"/>
  <line x1="98" y1="205" x2="160" y2="205" stroke="#8B7355" stroke-width="1.5" opacity="0.7"/>
  <line x1="102" y1="215" x2="160" y2="210" stroke="#8B7355" stroke-width="1.5" opacity="0.7"/>

  <!-- Whiskers right -->
  <line x1="300" y1="195" x2="240" y2="200" stroke="#8B7355" stroke-width="1.5" opacity="0.7"/>
  <line x1="302" y1="205" x2="240" y2="205" stroke="#8B7355" stroke-width="1.5" opacity="0.7"/>
  <line x1="298" y1="215" x2="240" y2="210" stroke="#8B7355" stroke-width="1.5" opacity="0.7"/>

  <!-- Cheek blush -->
  <ellipse cx="152" cy="200" rx="12" ry="7" fill="#ffb6c1" opacity="0.5"/>
  <ellipse cx="248" cy="200" rx="12" ry="7" fill="#ffb6c1" opacity="0.5"/>

  <!-- Head stripe -->
  <path d="M 185 92 Q 200 75 215 92" fill="#d2691e" opacity="0.6"/>
  <path d="M 170 100 Q 200 68 230 100" fill="none" stroke="#d2691e" stroke-width="4" opacity="0.4" stroke-linecap="round"/>
</svg>
